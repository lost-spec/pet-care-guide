<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Care Guide</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Pet Care Guide</h1>
      <p class="tagline">Your companion for happy, healthy pets</p>
    </header>
    <main>
      <form id="pet-form" class="pet-form">
        <div class="form-group">
          <label for="pet-type">Pet Type</label>
          <select id="pet-type" name="petType" required>
            <option value="">Select a pet type</option>
            <option value="Dog">Dog</option>
            <option value="Cat">Cat</option>
            <option value="Rabbit">Rabbit</option>
            <option value="Bird">Bird</option>
            <option value="Hamster">Hamster</option>
            <option value="Fish">Fish</option>
          </select>
        </div>
        <div class="form-group">
          <label for="breed">Breed</label>
          <input type="text" id="breed" name="breed" placeholder="e.g., Golden Retriever, Siamese, Holland Lop" required maxlength="50">
        </div>
        <button type="submit" id="submit-btn" class="btn-primary">
          <span class="btn-text">Get Care Info</span>
          <span class="spinner hidden" aria-hidden="true"></span>
        </button>
        <p id="form-error" class="error-message hidden" role="alert"></p>
      </form>

      <section id="results" class="results hidden" aria-live="polite">
        <div id="summary" class="summary"></div>

        <div class="sections-grid">
          <section class="section-card" id="feeding-section">
            <h2>Feeding</h2>
            <div id="feeding-keypoints" class="keypoints-grid"></div>
            <button type="button" class="btn-read-more" data-target="feeding-details" aria-expanded="false">
              <span class="read-more-text">Read more</span>
              <span class="chevron" aria-hidden="true">▼</span>
            </button>
            <p id="feeding-details" class="details hidden"></p>
          </section>

          <section class="section-card" id="environment-section">
            <h2>Environment</h2>
            <div id="environment-keypoints" class="keypoints-grid"></div>
            <button type="button" class="btn-read-more" data-target="environment-details" aria-expanded="false">
              <span class="read-more-text">Read more</span>
              <span class="chevron" aria-hidden="true">▼</span>
            </button>
            <p id="environment-details" class="details hidden"></p>
          </section>
        </div>

        <div id="warnings" class="warnings hidden" role="alert">
          <h3>⚠️ Important Warnings</h3>
          <ul id="warnings-list"></ul>
        </div>
      </section>

      <section id="error-state" class="error-state hidden" role="alert">
        <div class="error-icon" aria-hidden="true">⚠️</div>
        <h2 id="error-title">Something went wrong</h2>
        <p id="error-message"></p>
        <button type="button" id="retry-btn" class="btn-primary">Try Again</button>
      </section>
    </main>
    <footer>
      <p class="disclaimer">General guidance only. Consult a vet for specific health or diet decisions.</p>
      <p class="copyright">&copy; 2026 Pet Care Guide</p>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
